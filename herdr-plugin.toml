id = "durdn.interactive-subagents"
name = "Interactive Subagents"
version = "4.1.0"
min_herdr_version = "0.8.0"
description = "Role-based subagent workflows for pi, Claude Code, and Codex in Herdr"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "install-pi"
title = "Install the companion pi package"
command = ["node", "scripts/harness-install.mjs", "install", "pi"]

[[actions]]
id = "remove-pi"
title = "Remove the companion pi package"
command = ["node", "scripts/harness-install.mjs", "uninstall", "pi"]

[[actions]]
id = "doctor"
title = "Check Herdr interactive-subagent setup"
command = ["node", "scripts/pi-package.mjs", "doctor"]

[[actions]]
id = "install-claude"
title = "Install the Claude Code orchestrator plugin"
command = ["node", "scripts/harness-install.mjs", "install", "claude"]

[[actions]]
id = "remove-claude"
title = "Remove the Claude Code orchestrator plugin"
command = ["node", "scripts/harness-install.mjs", "uninstall", "claude"]

[[actions]]
id = "doctor-claude"
title = "Check the Claude Code orchestrator setup"
command = ["node", "scripts/harness-install.mjs", "doctor", "claude"]

[[actions]]
id = "install-codex"
title = "Install the Codex orchestrator skill"
command = ["node", "scripts/harness-install.mjs", "install", "codex"]

[[actions]]
id = "remove-codex"
title = "Remove the Codex orchestrator skill"
command = ["node", "scripts/harness-install.mjs", "uninstall", "codex"]

[[actions]]
id = "doctor-codex"
title = "Check the Codex orchestrator skill"
command = ["node", "scripts/harness-install.mjs", "doctor", "codex"]
